name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,torch]"

      - name: Ruff lint
        run: ruff check src tests examples

      - name: Ruff format
        run: ruff format --check src tests examples

      - name: Type check
        run: |
          set +e
          mypy --version
          python -m mypy --no-pretty --show-error-codes --explicit-package-bases -p greenai > mypy-out.txt 2>&1
          code=$?
          cat mypy-out.txt
          {
            echo "### mypy (python ${{ matrix.python-version }}) exit=$code"
            echo '```'
            cat mypy-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            head -n 20 mypy-out.txt | while IFS= read -r line; do
              echo "::error::mypy: $line"
            done
          fi
          exit "$code"

      - name: Tests
        if: success() || failure()
        run: pytest

      - name: Build package
        if: success() || failure()
        run: |
          pip install build
          python -m build
