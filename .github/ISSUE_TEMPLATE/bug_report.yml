name: Bug report
description: Report a bug in Green AI Profiler
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve measurement correctness.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Commands, model type, device, and expected vs actual output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package / Python / OS versions
    validations:
      required: true
